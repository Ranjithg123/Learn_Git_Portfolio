<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Portfolio | Contact</title>
</head>
<body>
    <main class="page page-content">
        <div class="dot-grid dot-grid-small dot-top-left" aria-hidden="true"></div>
        <div class="dot-grid dot-grid-left" aria-hidden="true"></div>

        <nav class="top-nav">
            <a href="index.html" class="nav-link">#home</a>
            <a href="about.html" class="nav-link">#about</a>
            <a href="projects.html" class="nav-link">#projects</a>
            <a href="services.html" class="nav-link">#services</a>
            <a href="experience.html" class="nav-link">#experience</a>
            <a href="contact.html" class="nav-link active">#contact</a>
        </nav>

        <section class="content-card">
            <h1 class="section-title">#contact</h1>
            <p class="content-text">Let's work together on your next project.</p>
            <ul class="contact-list">
                <li><span>Email:</span> hello@example.com</li>
                <li><span>Discord:</span> !o</li>
                <li><span>Location:</span> India</li>
            </ul>
            <a class="cta-link" href="mailto:hello@example.com">Send email</a>
        </section>

        <section class="content-card">
            <h2 class="section-subtitle">#quick-message</h2>
            <form class="form-grid" action="#">
                <label>
                    <span>Name</span>
                    <input type="text" class="form-control" placeholder="Your name">
                </label>
                <label>
                    <span>Email</span>
                    <input type="email" class="form-control" placeholder="you@example.com">
                </label>
                <label class="full">
                    <span>Message</span>
                    <textarea class="form-control" rows="5" placeholder="Tell me about your project"></textarea>
                </label>
                <button type="submit" class="cta-link">Submit</button>
            </form>
        </section>

        <footer class="site-footer">
            <p>Usually replies within 24 hours.</p>
        </footer>
    </main>
</body>
</html>
